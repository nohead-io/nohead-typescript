# Stages a release when its tag (v1.2.3) is pushed. Tags are pushed by the
# Nohead API repository's "SDK release" workflow, after this commit's smoke
# test passed against the API. npm trusted publishing (OIDC, no token) stages
# the package with provenance; it goes live only when a maintainer approves it
# on npm with 2FA (`npm stage approve <stage-id>`). The GitHub release
# is a draft until then; CHANGELOG.md's section for the version is its notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm's trusted publisher only accepts this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write # the draft GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      # Only a commit on main is released, whoever pushed the tag: the deploy
      # key that pushes tags also syncs the contract.
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        # Compared with main's commit, not the name, which a tag could shadow.
        run: |
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$REPO/compare/$main...$SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$TAG ($SHA) is not on main ($status)"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          # No dependency cache for a release: a poisoned cache could reach the package.
          package-manager-cache: false
      - name: Check the version and its notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
      # Also builds dist/ (prepare).
      - run: npm ci
      - run: npm test
      # The trusted publisher may only stage (npm 11.15+, which Node 26 has).
      - run: npm stage publish --provenance --access public
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file notes.md
