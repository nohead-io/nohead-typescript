name: CI

on:
  push:
    # The API repository pushes contract/update. Its pull request is opened by
    # github-actions (contract-pr.yml), which starts no pull_request run.
    branches: [main, contract/update]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node release line (package.json "engines").
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Also builds the package (prepare).
      - run: npm ci
      - run: npm test

  checks:
    name: Lint, types and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:smoke
      # The generated types and operation table must match openapi.json.
      - run: npm run generate && git diff --exit-code src/generated
      # The API reference's code samples must match test/calls.ts.
      - run: npm run samples && git diff --exit-code samples.json

  # The one check main's ruleset requires, so the required checks don't change
  # when the version matrix does.
  ci-success:
    name: CI passed
    if: always()
    needs: [test, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(. == "success")'
